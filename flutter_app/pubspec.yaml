name: aicar
description: AiCar — 수입차 AI 컨시어지 앱
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # 상태 관리
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # 네비게이션
  go_router: ^17.1.0

  # 네트워크
  dio: ^5.4.3+1

  # 로컬 저장소
  flutter_secure_storage: ^10.0.0
  drift: ^2.18.0
  drift_flutter: ^0.2.1
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # 환경 변수
  flutter_dotenv: ^6.0.0

  # JSON 직렬화 (런타임)
  json_annotation: ^4.9.0
  freezed_annotation: ^3.1.0

  # 소셜 로그인
  kakao_flutter_sdk_user: ^1.9.8
  sign_in_with_apple: ^7.0.1

  # UI
  smooth_page_indicator: ^2.0.1

  # 유틸
  intl: ^0.20.2
  equatable: ^2.0.5
  logger: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # 코드 생성
  build_runner: ^2.13.0
  riverpod_generator: ^4.0.0+1
  json_serializable: ^6.8.0
  freezed: ^3.2.3
  drift_dev: ^2.31.0
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icons/
    - assets/images/
    - assets/lottie/

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
