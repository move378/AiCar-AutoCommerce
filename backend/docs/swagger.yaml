basePath: /api/v1
definitions:
  dto.MarketingConsentRequest:
    properties:
      device_id:
        type: string
      marketing_agreed:
        type: boolean
    required:
    - device_id
    type: object
  dto.MarketingConsentResponse:
    properties:
      message:
        type: string
      status:
        type: integer
    type: object
  dto.OnboardingRequest:
    properties:
      device_id:
        description: 필수값
        type: string
      device_type:
        description: 필수값 (ios, android)
        type: string
      model_name:
        type: string
      os_version:
        type: string
    required:
    - device_id
    - device_type
    type: object
  dto.OnboardingResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  response.APIResponse:
    properties:
      data:
        description: 없으면 null 출력
      message:
        description: 에러일 때만 보이고, 성공 시(비어있을 때) 아예 숨김
        type: string
      status:
        description: HTTP 상태 코드
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: AICar AutoCommerce API
  title: AICar API
  version: "1.0"
paths:
  /api/v1/auth/agreed:
    post:
      consumes:
      - application/json
      description: 사용자의 마케팅 활용 동의 여부를 저장하거나 수정한다.
      parameters:
      - description: 마케팅 활용 동의 요청
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.MarketingConsentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MarketingConsentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.MarketingConsentResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.MarketingConsentResponse'
      summary: 마케팅 활용 동의 저장
      tags:
      - auth
  /auth/onboard:
    post:
      consumes:
      - application/json
      description: 디바이스 등록 + 유저 생성 + 토큰 발급
      parameters:
      - description: 온보딩 요청
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.OnboardingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.OnboardingResponse'
        "409":
          description: 이미 등록된 디바이스
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: 서버 오류
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: 온보딩
      tags:
      - auth
  /brands:
    get:
      description: 브랜드 목록을 조회합니다.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: 브랜드 목록 조회
      tags:
      - brands
  /cars/{id}/images:
    get:
      description: 차량 이미지를 조회합니다.
      parameters:
      - description: 차량 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: 차량 이미지 조회
      tags:
      - cars
swagger: "2.0"
