<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Apple Login Test</title>
  <script src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js"></script>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #f5f5f5; }
    #result { margin-top: 20px; padding: 16px; background: #fff; border-radius: 8px; max-width: 600px; word-break: break-all; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>Apple Login Test</h2>
  <div id="appleid-signin" data-color="black" data-border="true" data-type="sign in" style="cursor:pointer;"></div>
  <div id="result"></div>

  <script>
    AppleID.auth.init({
      clientId: 'com.aicar.oauth.service',
      scope: 'name email',
      redirectURI: 'https://glaucescent-babette-untolled.ngrok-free.dev/api/v1/auth/apple-callback',
      usePopup: true
    });

    document.getElementById('appleid-signin').addEventListener('click', async () => {
      try {
        const response = await AppleID.auth.signIn();
        document.getElementById('result').innerText =
          '✅ identity_token:\n' + response.authorization.id_token;
      } catch (e) {
        document.getElementById('result').innerText = '❌ 오류: ' + JSON.stringify(e);
      }
    });
  </script>
</body>
</html>
